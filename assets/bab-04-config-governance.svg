<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Governance dan config as code</title><desc id="desc">Siklus perubahan konfigurasi dari version control hingga deployment, observasi, dan rollback.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b76"/></marker></defs>
  <rect width="960" height="440" rx="18" fill="#f3f7f8"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183544">Governance konfigurasi sebagai kode</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="48" y="122" width="176" height="82" rx="13" fill="#ffffff" stroke="#98b4c0" stroke-width="2"/><text x="136" y="156" font-size="16" font-weight="700" fill="#183544">Version control</text><text x="136" y="181" font-size="13" fill="#526b77">diff + pemilik</text>
    <rect x="280" y="122" width="176" height="82" rx="13" fill="#e8eef4" stroke="#66849a" stroke-width="2"/><text x="368" y="156" font-size="16" font-weight="700" fill="#183544">Review + policy</text><text x="368" y="181" font-size="13" fill="#526b77">approve perubahan</text>
    <rect x="512" y="122" width="176" height="82" rx="13" fill="#d9edf1" stroke="#4a8794" stroke-width="2"/><text x="600" y="156" font-size="16" font-weight="700" fill="#183544">Validasi + test</text><text x="600" y="181" font-size="13" fill="#315b76">syntax + routing</text>
    <rect x="744" y="122" width="176" height="82" rx="13" fill="#e4f0e3" stroke="#648c66" stroke-width="2"/><text x="832" y="156" font-size="16" font-weight="700" fill="#183544">Deploy</text><text x="832" y="181" font-size="13" fill="#46684a">versi terlacak</text>
    <rect x="624" y="285" width="220" height="78" rx="13" fill="#ffffff" stroke="#98b4c0" stroke-width="2"/><text x="734" y="317" font-size="16" font-weight="700" fill="#183544">Observe + evidence</text><text x="734" y="341" font-size="13" fill="#526b77">log, metrik, status</text>
    <rect x="280" y="285" width="220" height="78" rx="13" fill="#fff1d9" stroke="#c28b38" stroke-width="2"/><text x="390" y="317" font-size="16" font-weight="700" fill="#694d23">Rollback</text><text x="390" y="341" font-size="13" fill="#694d23">versi diketahui baik</text>
  </g>
  <g fill="none" stroke="#315b76" stroke-width="3" marker-end="url(#arrow)"><path d="M224 163 H280"/><path d="M456 163 H512"/><path d="M688 163 H744"/><path d="M832 204 V285"/><path d="M624 324 H500"/></g>
  <path d="M280 324 C190 324 166 263 165 204" fill="none" stroke="#c28b38" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="133" y="284" font-family="Arial,sans-serif" font-size="12" fill="#8b642b">insiden / gagal gate</text>
  <text x="48" y="407" font-family="Arial,sans-serif" font-size="13" fill="#526b77">Simpan konfigurasi, bukan secret; tautkan setiap rilis ke commit dan hasil pemeriksaan.</text>
</svg>
